services:

  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./backend:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: php

    volumes:
      - ./backend:/app

    depends_on:
      - database


  database:
    image: mysql:8.4

    container_name: database

    environment:
      MYSQL_DATABASE: app
      MYSQL_USER: symfony
      MYSQL_PASSWORD: password
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3306:3306"

    volumes:
      - database_data:/var/lib/mysql


  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile

    container_name: node

    working_dir: /app

    volumes:
      - ./frontend:/app

    ports:
      - "5173:5173"

    tty: true


volumes:
  database_data: 
