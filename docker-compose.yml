services:

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: php

    volumes:
      - ./backend:/app

    working_dir: /app

    expose:
      - "9000"

    depends_on:
      - database


  nginx:
    image: nginx:latest

    container_name: nginx

    ports:
      - "80:80"

    volumes:
      - ./backend:/app
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - php


  database:
    image: mysql:8.4

    container_name: database

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: app
      MYSQL_USER: symfony
      MYSQL_PASSWORD: password

    ports:
      - "3306:3306"

    volumes:
      - database_data:/var/lib/mysql


  node:
    build:
      context: .
      dockerfile: docker/node/Dockerfile

    container_name: node

    volumes:
      - ./frontend:/app
      - /app/node_modules

    working_dir: /app

    ports:
      - "5173:5173"

    command: npm run dev -- --host 0.0.0.0

    depends_on:
      - php


  phpmyadmin:
    image: phpmyadmin:latest

    container_name: phpmyadmin

    depends_on:
      - database

    environment:
      PMA_HOST: database
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root

    ports:
      - "8080:80"


volumes:

  database_data: