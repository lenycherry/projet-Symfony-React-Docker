security:
    # Gestion du hash des mots de passe
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Chargement des utilisateurs depuis Doctrine
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email

    firewalls:
        # Désactive la sécurité sur les outils Symfony et fichiers statiques
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        # Firewall API principal
        main:
            lazy: true
            stateless: true
            provider: app_user_provider

            # Authentification JSON avec email + mot de passe
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password

            # Authentification par token JWT
            jwt: ~

    access_control:
        # Autorise la connexion sans token
        - { path: ^/api/login, roles: PUBLIC_ACCESS }

        # Les routes utilisateurs nécessitent un JWT valide
        - { path: ^/api/users, roles: ROLE_USER }


when@test:
    security:
        password_hashers:
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4
                time_cost: 3
                memory_cost: 10